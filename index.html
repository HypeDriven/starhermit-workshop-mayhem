<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2a2018" />
<title>Workshop Mayhem</title>
<meta name="description" content="A physics toy: whimsical tools, one resilient training dummy, and a playful inventor's workshop." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
<link rel="stylesheet" href="./css/main.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <a class="skip-link" href="#screen-root">Skip to interface</a>
  <div id="app">
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="captions" aria-hidden="true"></div>
    <div id="hud-root" class="hidden"></div>
    <div id="screen-root" role="main"></div>
    <div id="overlay-root" class="hidden"></div>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>
  <div id="board-mirror" class="sr-only" role="region" aria-label="Board state summary"></div>
  <noscript>
    <div class="panel narrow" style="margin:4rem auto;max-width:36rem;padding:2rem">
      <h1>Workshop Mayhem needs JavaScript</h1>
      <p>The workshop is an interactive physics toy and requires JavaScript to run.</p>
    </div>
  </noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
